[package]
name = "rigelcam-app"
version = "0.1.1"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false

[[bin]]
name = "rigelcam"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-allocators = "0.25"
rigelcam-core = { path = "../rigelcam-core" }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# The updater is the only part that needs TLS, and Linux gets its updates elsewhere.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }

[build-dependencies]
cxx-qt-build = "0.10"
pkg-config = "0.3"
