[package]
name = "rigelcam-core"
version = "0.1.3"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Talks to Dahua based recorders over their HTTP API and RTSP"
publish = false

[dependencies]
digest_auth = "0.3.1"
dirs = "7.0.0"
keyring = "4.2.0"
md-5 = "0.10"
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Without gzip, so the limit on a body counts what was decoded, and without TLS, which recorders
# here don't use.
ureq = { version = "3.5.0", default-features = false }

# For the Flatpak build, which stores passwords through the Secret portal.
[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2"
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
