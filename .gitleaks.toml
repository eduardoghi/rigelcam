[extend]
useDefault = true

# RTSP and HTTP addresses with a password are the likeliest leak here, from pasted logs or commands.
[[rules]]
id = "url-with-password"
description = "URL with a password"
regex = '''(?i)\b(?:rtsps?|https?)://[^\s/:@'"]*:([^\s@'"]+)@'''
secretGroup = 1

# Only placeholders, written as an environment variable or as <name>.
[rules.allowlist]
regexes = ['''^(?:\$\{?[A-Z_][A-Z0-9_]*\}?|<[a-z_-]+>)$''']
