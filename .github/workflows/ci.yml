name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the whole history, since a secret in any commit stays readable in a public repository.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact .

  core:
    name: format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # rigelcam-app needs Qt and GStreamer, so it has a job of its own.
      - run: cargo clippy -p rigelcam-core --all-targets --locked -- -D warnings
      - run: cargo test -p rigelcam-core --locked

  app:
    name: app on Linux
    # The newest image, since the Qt of the older ones is far behind the one the app is built on.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install Qt and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libegl-dev libgles-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev pkgconf \
            qt6-base-dev qt6-declarative-dev qt6-l10n-tools
      - run: rustup component add clippy
      # Keeps the compiled dependencies, which take most of the time of this job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The arguments of a QML function can't be grouped, since QML calls it with each of them.
      - run: cargo clippy -p rigelcam-app --all-targets --locked -- -D warnings -A clippy::too_many_arguments
      - run: cargo test -p rigelcam-app --locked
