name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Scans the whole history, since a secret in any commit stays readable in a public repository.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact .

  core:
    name: format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      # rigelcam-app needs Qt and GStreamer, which this job doesn't install yet.
      - run: cargo clippy -p rigelcam-core --all-targets --locked -- -D warnings
      - run: cargo test -p rigelcam-core --locked
