name: release

on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would upload to the same draft. The second one waits, and then stops at the check
# for a published version if the first one went all the way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GSTREAMER_VERSION: 1.28.8
  GSTREAMER_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
  QT_VERSION: 6.10.3
  INNO_VERSION: 7.1.0
  INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f

jobs:
  checks:
    name: ready to release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, to find the last commit the Windows check ran on.
          fetch-depth: 0
      - name: read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/rigelcam-app/Cargo.toml | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Published versions can't change, so one that exists has to be bumped first. The Windows
      # check only runs on commits that change what it builds, so it has to have passed since the
      # last of those.
      - name: require a new version on main with CI passing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          test "$passed" -ge 1
          # A push of several commits runs it only on the newest, which also holds that change.
          built=$(git log -1 --first-parent --format=%H -- crates Cargo.toml Cargo.lock .github/workflows/windows.yml)
          checked=false
          # Only runs on main itself, since a run of a pull request checked another tree.
          for commit in $(git rev-list --first-parent "$built^..$GITHUB_SHA"); do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows.yml --commit "$commit" \
              --event push --branch main --status success --json databaseId --jq length)
            if [ "$passed" -ge 1 ]; then checked=true; break; fi
          done
          test "$checked" = true
          # Only a release that doesn't exist counts as a draft, so a failing call stops here.
          if answer=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq .isDraft 2>&1); then
            test "$answer" = true
          else
            echo "$answer" | grep -q 'release not found'
          fi

  windows:
    name: build for Windows
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install GStreamer
        shell: pwsh
        run: |
          $installer = "gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          Invoke-WebRequest -OutFile $installer `
            "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/$installer"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:GSTREAMER_SHA256) {
            throw 'the GStreamer installer does not match its hash'
          }
          $process = Start-Process ".\$installer" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\gstreamer'
          if ($process.ExitCode -ne 0) { throw "the GStreamer installer failed ($($process.ExitCode))" }
          foreach ($file in 'bin\pkg-config.exe', 'lib\pkgconfig\gstreamer-d3d11-1.0.pc') {
            if (-not (Test-Path "C:\gstreamer\$file")) { throw "GStreamer came without $file" }
          }
      - name: install Qt
        shell: pwsh
        run: |
          # Every package with its hash, so a file changed on PyPI stops the install.
          python -m pip install --require-hashes -r packaging\windows\aqtinstall.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip failed' }
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir C:\Qt
          if ($LASTEXITCODE -ne 0) { throw 'aqt failed' }
      - name: install Inno Setup
        shell: pwsh
        run: |
          $installer = "innosetup-$env:INNO_VERSION-x64.exe"
          $tag = 'is-' + $env:INNO_VERSION.Replace('.', '_')
          Invoke-WebRequest -OutFile $installer `
            "https://github.com/jrsoftware/issrc/releases/download/$tag/$installer"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:INNO_SHA256) {
            throw 'the Inno Setup installer does not match its hash'
          }
          $process = Start-Process ".\$installer" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\innosetup'
          if ($process.ExitCode -ne 0) { throw "the Inno Setup installer failed ($($process.ExitCode))" }
      - name: build and bundle
        shell: pwsh
        env:
          QMAKE: C:\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin\qmake.exe
          PKG_CONFIG: C:\gstreamer\bin\pkg-config.exe
          PKG_CONFIG_PATH: C:\gstreamer\lib\pkgconfig
          GSTREAMER_ROOT: C:\gstreamer
        run: |
          $qt = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          $env:PATH = "$qt\bin;C:\gstreamer\bin;$env:PATH"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = Join-Path (& $vswhere -latest -property installationPath) 'VC\Auxiliary\Build\vcvars64.bat'
          $bundle = "powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\bundle.ps1 " +
            "-Executable target\release\rigelcam.exe -Qt $qt -Gstreamer C:\gstreamer -Output rigelcam"
          cmd /c "`"$vcvars`" && cargo build --release --locked -p rigelcam-app && $bundle"
          if ($LASTEXITCODE -ne 0) { throw 'the build failed' }
          Compress-Archive rigelcam "rigelcam-$env:VERSION-windows-x64.zip"
          & C:\innosetup\ISCC.exe "/DVersion=$env:VERSION" packaging\windows\rigelcam.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer failed' }
      # A published version can't be replaced, so a broken way to update has to stop the next one.
      - name: reach the published release as the app does
        shell: pwsh
        env:
          QMAKE: C:\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin\qmake.exe
          PKG_CONFIG: C:\gstreamer\bin\pkg-config.exe
          PKG_CONFIG_PATH: C:\gstreamer\lib\pkgconfig
          GSTREAMER_ROOT: C:\gstreamer
        run: |
          $qt = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          $env:PATH = "$qt\bin;C:\gstreamer\bin;$env:PATH"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = Join-Path (& $vswhere -latest -property installationPath) 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cargo test --release --locked -p rigelcam-app the_published_release -- --ignored"
          if ($LASTEXITCODE -ne 0) { throw 'the published release could not be reached' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            rigelcam-*-windows-x64.zip
            rigelcam-*-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    name: build for Linux
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: build the bundle
        run: packaging/linux/build-flatpak.sh "rigelcam-$VERSION-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: rigelcam-*-linux-x86_64.flatpak
          if-no-files-found: error

  # Apart from the build, so nothing that compiles third-party code can write to the release or sign
  # in as this workflow.
  draft:
    name: create the draft
    needs: [checks, windows, linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Holds the signing key, and only admits runs on main.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/rigelcam-*
      # The version goes in the signed comment, which keeps an old installer from being offered as
      # a new one. The key is only on the disk for this step.
      - name: sign the installer and write the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: assets
        run: |
          test -n "$MINISIGN_SECRET_KEY"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          installer="rigelcam-$VERSION-windows-x64-setup.exe"
          minisign -S -s "$key" -m "$installer" -x "$RUNNER_TEMP/installer.minisig" \
            -t "rigelcam $VERSION"
          rm -f "$key"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$installer"
          jq -n --arg version "$VERSION" --arg url "$url" \
            --rawfile signature "$RUNNER_TEMP/installer.minisig" \
            '{version: $version, url: $url, signature: $signature}' > latest.json
      - name: upload to a draft, which is published by hand
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: assets
        run: |
          sha256sum -- rigelcam-* latest.json > SHA256SUMS.txt
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Rigelcam $VERSION" --notes "Write the release notes here before publishing."
          else
            # A draft keeps the commit of its first run, and publishing puts the tag there.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber -- rigelcam-* latest.json \
            SHA256SUMS.txt
