name: release

on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would upload to the same draft. The second one waits, and then stops at the check
# for a published version if the first one went all the way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Writes the notices of the crates in the packages, with about.toml and about.hbs.
  CARGO_ABOUT_VERSION: 0.9.3
  CARGO_ABOUT_LINUX_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4

jobs:
  checks:
    name: ready to release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, to find the last commit the Windows check ran on.
          fetch-depth: 0
      - name: read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/rigelcam-app/Cargo.toml | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Published versions can't change, so one that exists has to be bumped first. The Windows check
      # and the Flatpak build only run on commits that change what they build, so each has to have
      # passed since the last of those.
      - name: require a new version on main with CI passing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          test "$passed" -ge 1
          # Takes the workflow and the paths that start it, which have to match its `on.push.paths`.
          # A push of several commits runs it only on the newest, which also holds that change, and
          # only runs on main itself count, since a run of a pull request checked another tree.
          passed_since_change() {
            local workflow=$1 commit runs built
            shift
            built=$(git log -1 --first-parent --format=%H -- "$@")
            for commit in $(git rev-list --first-parent "$built^..$GITHUB_SHA"); do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$commit" \
                --event push --branch main --status success --json databaseId --jq length)
              if [ "$runs" -ge 1 ]; then return 0; fi
            done
            echo "$workflow hasn't passed on main since $built" >&2
            return 1
          }
          passed_since_change windows.yml crates Cargo.toml Cargo.lock \
            packaging/windows/aqtinstall.txt packaging/windows/qt-archives.sha256 \
            packaging/windows/install-qt.ps1 assets/branding .github/workflows/windows.yml
          passed_since_change flatpak.yml crates assets/branding packaging/linux LICENSE Cargo.toml \
            Cargo.lock about.toml about.hbs .github/workflows/flatpak.yml
          # Only a release that doesn't exist counts as a draft, so a failing call stops here.
          if answer=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq .isDraft 2>&1); then
            test "$answer" = true
          else
            echo "$answer" | grep -q 'release not found'
          fi

  windows:
    needs: checks
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ needs.checks.outputs.version }}
      release: true

  linux:
    name: build for Linux
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: install cargo-about
        run: |
          archive="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$archive"
          echo "$CARGO_ABOUT_LINUX_SHA256  $archive" | sha256sum --check
          tar xzf "$archive" --strip-components=1 -C ~/.cargo/bin \
            "cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl/cargo-about"
      - name: build the bundle
        run: packaging/linux/build-flatpak.sh "rigelcam-$VERSION-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: rigelcam-*-linux-x86_64.flatpak
          if-no-files-found: error

  # Apart from the build, so nothing that compiles third-party code can write to the release or sign
  # in as this workflow.
  draft:
    name: create the draft
    needs: [checks, windows, linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Holds the signing key, and only admits runs on main.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/rigelcam-*
      # The version goes in the signed comment, which keeps an old installer from being offered as
      # a new one. The key is only on the disk for this step.
      - name: sign the installer and write the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: assets
        run: |
          test -n "$MINISIGN_SECRET_KEY"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          installer="rigelcam-$VERSION-windows-x64-setup.exe"
          minisign -S -s "$key" -m "$installer" -x "$RUNNER_TEMP/installer.minisig" \
            -t "rigelcam $VERSION"
          rm -f "$key"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$installer"
          jq -n --arg version "$VERSION" --arg url "$url" \
            --rawfile signature "$RUNNER_TEMP/installer.minisig" \
            '{version: $version, url: $url, signature: $signature}' > latest.json
      - name: upload to a draft, which is published by hand
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: assets
        run: |
          sha256sum -- rigelcam-* latest.json > SHA256SUMS.txt
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Rigelcam $VERSION" --notes "Write the release notes here before publishing."
          else
            # A draft keeps the commit of its first run, and publishing puts the tag there.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber -- rigelcam-* latest.json \
            SHA256SUMS.txt
